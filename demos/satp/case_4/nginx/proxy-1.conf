server {
  listen 8080;
  server_name localhost;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_ssl_protocols TLSv1.3;
    proxy_ssl_server_name on;
    proxy_ssl_name proxy-2.case4.test;
    proxy_ssl_trusted_certificate /run/case4/tls/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    include /etc/nginx/scenario/egress.conf;
    set $peer_upstream satp-tls-proxy-2:3443;
    proxy_pass https://$peer_upstream;
  }
}

server {
  listen 3443 ssl;
  server_name proxy-1.case4.test;

  ssl_protocols TLSv1.3;
  ssl_session_cache off;
  ssl_session_tickets off;
  ssl_certificate /run/case4/tls/server.crt;
  ssl_certificate_key /run/case4/tls/server.key;
  ssl_client_certificate /run/case4/tls/ca.crt;
  include /etc/nginx/scenario/ingress.conf;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    set $local_gateway satp-hermes-gateway-1:3010;
    proxy_pass http://$local_gateway;
  }
}
